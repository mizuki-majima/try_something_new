name: Task
description: Work item (feature / test / research / growth / tech-debt / security)
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: Why this matters now. Which Gate or KPI does it move?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Checkable conditions. "Done" means every box can be ticked.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 — blocks the next Gate, P1 — needed this phase, P2 — should do, P3 — nice to have]
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [IDEA, VALIDATE, SPEC, BUILD, REVIEW, TEST, PILOT, LIVE]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues or decisions this waits on (e.g. "#12", "CEO decision"). Write "なし" if none.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Add the matching `phase:*`, `priority:*`, `type:*` labels. Scope check: is this on PRODUCT.md's Do Not Build list?"
